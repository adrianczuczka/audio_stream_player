name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly run against stable + beta to catch upcoming Flutter breakage
    # and pub score regressions before users hit them.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze & test (${{ matrix.channel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
          cache: true
      - run: flutter pub get
      # Beta deprecates APIs that stable has no replacement for yet (such
      # as package:flutter/material.dart), so infos don't fail beta.
      # Warnings and errors still do.
      - run: flutter analyze ${{ matrix.channel == 'beta' && '--no-fatal-infos' || '' }}
      - run: flutter test
      # Runs the web backend's browser tests in headless Chrome.
      - run: flutter test --platform chrome

  pana:
    name: Pub score (pana)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub global activate pana
      # Pana uses these tools to validate and convert the animated screenshot.
      - name: Install screenshot tools
        run: sudo apt-get update && sudo apt-get install -y webp
      - run: pana --no-warning --exit-code-threshold 0 .

  build-example-android:
    name: Build example (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build apk --debug
        working-directory: example

  build-example-web:
    name: Build example (Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build web --release
        working-directory: example
      # The wasm build additionally proves the js_interop usage is
      # WasmGC-compatible.
      - run: flutter build web --wasm
        working-directory: example
      - name: Build streaming TTS demo
        run: flutter build web --release --target lib/tts_main.dart
        working-directory: example

  build-example-darwin:
    name: Build example (iOS & macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build ios --debug --no-codesign
        working-directory: example
      - run: flutter build macos --debug
        working-directory: example
