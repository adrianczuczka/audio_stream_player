name: audio_stream_player
description: >-
  Low-latency PCM audio streaming player. Feed raw audio chunks from TTS or
  realtime voice APIs and hear them as they arrive, with buffer introspection,
  underrun events, and drain completion.
version: 1.0.0
repository: https://github.com/adrianczuczka/audio_stream_player
issue_tracker: https://github.com/adrianczuczka/audio_stream_player/issues
topics:
  - audio
  - pcm
  - streaming
  - tts
  - voice

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.adrianczuczka.audio_stream_player
        pluginClass: AudioStreamPlayerPlugin
      ios:
        pluginClass: AudioStreamPlayerPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: AudioStreamPlayerPlugin
        sharedDarwinSource: true
